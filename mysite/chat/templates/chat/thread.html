<!DOCTYPE html>
<html>
    <head>
        <title>Thread</title>
    </head>
    <body>
       
        <h1>{{ thread.header }}</h1>
        <h3>{{ thread.content }}</h3>

       {% if thread.message_set.all %}
        <hr />
        {% for message in thread.message_set.all %}
           <p>{{ message.message }}</p>
        <hr />
        {% endfor %}
        {% else %}
            <p>No comments to this thread yet.</p>
        {% endif %}

        <h2>Add new comment</h2>

        <form action="" method="POST">
            {% csrf_token %}
            <p>Message: <br/>
                <textarea id="content" name="content" rows="4" cols="40"></textarea></p>
            <p><input type="submit" value="Submit"/></p>
        </form>

    </body>
</html>
