<!DOCTYPE html>
<html>
    <head>
        <title>Welcome to chat</title>
    </head>
    <body>

        <h1>Welcome to chat</h1>
        <h2>All threads</h2>
        
        {% if threads %}
            <ul>
            {% for thread in threads %}
                <li><a href="/chat/{{ thread.id }}/">{{ thread.header }}</a></li>
            {% endfor %}
            </ul>
        {% else %}
            <p>No threads currently available.</p>
        {% endif %}

        <h2>Add new thread</h2>

        <form action="/chat/" method="POST">
            {% csrf_token %}
            <p>Header: <br/>
                <input type="text" id="header" name="header"/></p>
            <p>Message: <br/>
                <textarea id="content" name="content" rows="4" cols="40"></textarea></p>
            <p><input type="submit" value="Submit"/></p>
        </form>

    </body>
</html>
